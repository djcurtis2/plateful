<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Yumjack</title>
<style>
  :root { --bg: #f3f5f0; --card: #ffffff; --ink: #1b2a20; --muted: #5d6b62; --line: #dde3da; --green: #2F6B46; --on-green: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111813; --card: #1a241d; --ink: #e8efe9; --muted: #98a89d; --line: #2a362d; --green: #5fae7f; --on-green: #0d1610; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
         padding: calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 32px); }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 20px; margin: 0 0 8px; }
  h3 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 2px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  label { display: flex; align-items: center; gap: 12px; padding: 10px 0; cursor: pointer; }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--green); flex: none; }
  input:checked + span { color: var(--muted); text-decoration: line-through; }
  .empty { color: var(--muted); }
  button { font: inherit; font-weight: 600; background: var(--green); color: var(--on-green); border: 0; border-radius: 12px; padding: 12px 20px; width: 100%; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p class="sub">Your saved grocery lists:</p>
  <div id="lists"></div>
  <button id="retry" type="button">Try again</button>
</main>
<script src="offline.js"></script>
</body>
</html>
