# Builds the Yumjack iPhone app (a Capacitor shell around https://yumjack.app) and sends it to TestFlight.
# Start it by hand in Codemagic: Start new build -> workflow "ios-testflight". See mobile/README.md.
# No secrets live in this file: signing uses the App Store Connect integration named "yumjack_asc".
workflows:
  # A test copy for a pretend iPhone (Appetize). No Apple account or signing needed.
  # Start it by hand: Start new build -> workflow "ios-simulator", then upload the
  # yumjack-simulator.zip it makes to appetize.io (Upload -> iOS).
  ios-simulator:
    name: Yumjack iOS simulator test copy
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: mobile
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install packages
        script: npm ci
      - name: Sync web files and plugins into the iOS project
        script: npx cap sync ios
      - name: Build for the simulator
        script: |
          set -e
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Pack it for Appetize
        script: |
          set -e
          cd build/Build/Products/Release-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent App.app "$CM_BUILD_DIR/mobile/yumjack-simulator.zip"
          ls -lh "$CM_BUILD_DIR/mobile/yumjack-simulator.zip"
    artifacts:
      - mobile/yumjack-simulator.zip

  ios-testflight:
    name: Yumjack iOS to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile
    integrations:
      app_store_connect: yumjack_asc
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.yumjack.ios
      vars:
        BUNDLE_ID: app.yumjack.ios
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
    scripts:
      - name: Install packages
        script: npm ci
      - name: Make sure the iOS project exists
        script: |
          # The project is committed. If it was ever removed, make a fresh one.
          if [ ! -d ios ]; then
            npx cap add ios --packagemanager SPM
          fi
      - name: Sync web files and plugins into the iOS project
        script: npx cap sync ios
      - name: Check the app settings Apple needs
        script: |
          set -e
          PLIST=ios/App/App/Info.plist
          ENT=ios/App/App/App.entitlements
          PB=/usr/libexec/PlistBuddy
          $PB -c "Set :NSCameraUsageDescription 'Yumjack uses your camera to snap a dish and find its recipe.'" $PLIST 2>/dev/null \
            || $PB -c "Add :NSCameraUsageDescription string 'Yumjack uses your camera to snap a dish and find its recipe.'" $PLIST
          $PB -c "Set :NSPhotoLibraryUsageDescription 'Yumjack lets you pick a photo of a dish from your library.'" $PLIST 2>/dev/null \
            || $PB -c "Add :NSPhotoLibraryUsageDescription string 'Yumjack lets you pick a photo of a dish from your library.'" $PLIST
          $PB -c "Set :ITSAppUsesNonExemptEncryption false" $PLIST 2>/dev/null \
            || $PB -c "Add :ITSAppUsesNonExemptEncryption bool false" $PLIST
          # The app's own link (app.yumjack.ios://), used to come back from Google sign-in.
          # Adds it at the end if missing; other URL types are left alone.
          if ! $PB -c "Print :CFBundleURLTypes" $PLIST 2>/dev/null | grep -q "app.yumjack.ios"; then
            $PB -c "Add :CFBundleURLTypes array" $PLIST 2>/dev/null || true
            i=0
            while $PB -c "Print :CFBundleURLTypes:$i" $PLIST >/dev/null 2>&1; do i=$((i+1)); done
            $PB -c "Add :CFBundleURLTypes:$i dict" $PLIST
            $PB -c "Add :CFBundleURLTypes:$i:CFBundleURLName string app.yumjack.ios" $PLIST
            $PB -c "Add :CFBundleURLTypes:$i:CFBundleURLSchemes array" $PLIST
            $PB -c "Add :CFBundleURLTypes:$i:CFBundleURLSchemes:0 string app.yumjack.ios" $PLIST
          fi
          if [ ! -f "$ENT" ]; then
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<plist version="1.0"><dict/></plist>\n' > "$ENT"
          fi
          $PB -c "Print :com.apple.developer.associated-domains" "$ENT" 2>/dev/null | grep -q "applinks:yumjack.app" \
            || { $PB -c "Add :com.apple.developer.associated-domains array" "$ENT" 2>/dev/null || true; \
                 $PB -c "Add :com.apple.developer.associated-domains:0 string applinks:yumjack.app" "$ENT"; }
          # Sign in with Apple (the App ID capability must be ticked too).
          $PB -c "Print :com.apple.developer.applesignin" "$ENT" 2>/dev/null | grep -q "Default" \
            || { $PB -c "Add :com.apple.developer.applesignin array" "$ENT" 2>/dev/null || true; \
                 $PB -c "Add :com.apple.developer.applesignin:0 string Default" "$ENT"; }
          # Push notifications (the App ID's Push Notifications capability must be ticked too).
          $PB -c "Print :aps-environment" "$ENT" >/dev/null 2>&1             || $PB -c "Add :aps-environment string production" "$ENT"
          # Point the app target at the entitlements file if the project does not already.
          grep -q "CODE_SIGN_ENTITLEMENTS" "$XCODE_PROJECT/project.pbxproj" \
            || sed -i '' 's|CODE_SIGN_STYLE = Automatic;|CODE_SIGN_ENTITLEMENTS = App/App.entitlements; CODE_SIGN_STYLE = Automatic;|' "$XCODE_PROJECT/project.pbxproj"
          $PB -c "Print" $PLIST | grep -E "NSCameraUsageDescription|NSPhotoLibraryUsageDescription|ITSAppUsesNonExemptEncryption|app.yumjack.ios"
          $PB -c "Print" "$ENT"
      - name: Set up signing
        script: xcode-project use-profiles
      - name: Number this build
        script: |
          # TestFlight needs each upload to have a higher build number than the last.
          # Codemagic's BUILD_NUMBER goes up by one on every build of this workflow.
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build the app
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - mobile/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
